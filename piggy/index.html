<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>AI Piggy Bank</title>
<style>
:root{--bg:#0d1420;--fg:#e8eef7;--muted:#9fb0c6;--accent:#3987e5}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px;text-align:center}
h1{font-size:22px;margin:0 0 8px} p{margin:6px 0;color:var(--muted)} a{color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2}} @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head>
<body><main>
<h1>AI Piggy Bank</h1>
<p id="msg"><span class="dot"></span> Opening the piggy bank…</p>
<p id="ar" dir="rtl">بنفتح الحصالة…</p>
</main>
<script>
(async () => {
  const key = location.hash.slice(1);
  const say = (en, ar) => { msg.textContent = en; document.getElementById('ar').textContent = ar; };
  if (!key) return say('This link is missing its access key. Ask the owner for the full link.', 'اللينك ناقص مفتاح الدخول. اطلب اللينك الكامل من صاحب المشروع.');
  let url = '';
  try {
    const r = await fetch('https://api.github.com/repos/Elbastwissy/fpilot-tower-link/contents/url-piggy.txt', {cache: 'no-store', headers: {Accept: 'application/vnd.github.raw'}});
    if (r.ok) url = (await r.text()).trim();
  } catch (e) {}
  if (!url) { try { const r = await fetch('../url-piggy.txt?' + Date.now(), {cache: 'no-store'}); if (r.ok) url = (await r.text()).trim(); } catch (e) {} }
  if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) return say('The piggy bank is offline right now (the laptop may be asleep). Try again later.', 'الحصالة مقفولة دلوقتي (ممكن اللابتوب نايم). جرّب تاني بعدين.');
  location.replace(url + '/?k=' + encodeURIComponent(key));
})();
</script>
</body></html>
